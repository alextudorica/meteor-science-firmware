# Science mode settings, read once at start from /root/science/science.conf.
# One "key = number" per line; lines starting with # and lines whose value is not
# a number are ignored. See doc/science.md for every key and its default.

# Station position in decimal degrees, north and east positive. Replace both
# placeholders; while either is missing the camera stays in the night baseline.
lat = LATITUDE
lon = LONGITUDE
# Switch to night below this sun altitude [deg]
switch_deg = -5

# Night baseline: manual exposure [us] and gains (x1024 = 1x). These are IMX307
# values used as a starting point on an IMX291; tune them per camera.
night_again = 22924
night_dgain = 1024
night_ispdgain = 2048
night_exp = 39941

# ISP frame rate. 25.00 gives a frame period one sensor line too long on the
# IMX291 (24.98 fps); 25.01 gives 40.000 ms frames.
sensor_fps = 25.01

# Colour at night, with chroma quantised 6 QP steps coarser than luma, and a
# black-and-white hour (UTC) for comparison
night_satu = 128
chroma_qp_offset = 6
mono_from_utc = 22
mono_to_utc = 23

# Sensor black level removed by the gamma table (12-bit; IMX291: 240)
pedestal = 240
# Clients allowed on the :9600 control port (IPv4 or CIDR, comma separated).
# Without this line only loopback is served.
control_allow = HOST_IP/32
