# Camera clock slaved to the capture host, which runs a chrony server that allows the camera's
# subnet (on the host: "allow <camera subnet>/24" in its chrony configuration).
# The RMSP SEI frame times come from this clock.
server HOST_IP iburst minpoll 3 maxpoll 5
# Step only while converging after boot; afterwards slew, so frame times never jump mid-night.
makestep 0.5 3
driftfile /etc/chrony.drift
bindcmdaddress 127.0.0.1
cmdallow 127.0.0.1
pidfile /var/run/chronyd.pid
